services:
  - type: web
    name: orvian-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ORVIAN_ADMIN_USER
        value: admin
      - key: ORVIAN_ADMIN_EMAIL
        value: admin@orvian.local
      - key: ORVIAN_ADMIN_PASSWORD
        sync: false
      - key: ORVIAN_DEMO_USER
        value: rony
      - key: ORVIAN_DEMO_EMAIL
        value: rony@orvian.local
      - key: ORVIAN_DEMO_PASSWORD
        sync: false
      - key: MEDIA_STORAGE
        value: local
